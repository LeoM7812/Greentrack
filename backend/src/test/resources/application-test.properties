# Test profile: in-memory database and dummy secrets, so tests run without a local PostgreSQL.
spring.datasource.url=jdbc:h2:mem:greentrack_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Base64 test-only key (not used anywhere else)
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWdyZWVudHJhY2stdW5pdC10ZXN0cw==
