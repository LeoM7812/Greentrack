spring.application.name=backend
# Configuração da base de dados PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/greentrack_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update


# Mostrar queries SQL no terminal (debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Spring Security (opcional, se não usar autenticação)

# Configurar timezone da aplicação (opcional, mas recomendado)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Server config (porta padrão, opcional mudar)
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expirationMs=86400000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB