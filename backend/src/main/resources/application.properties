spring.application.name=backend
# Configuração da base de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/greentrack_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Configuração do pool de conexões (opcional, ajuste conforme necessário)
spring.security.user.name=
spring.security.user.password=
spring.security.user.roles=

# Mostrar queries SQL no terminal (debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Spring Security (opcional, se não usar autenticação)

# Configurar timezone da aplicação (opcional, mas recomendado)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Server config (porta padrão, opcional mudar)
server.port=8080

# JWT Configuration
jwt.secret=VGhpcy1pcy1hLW5ldy1zZWN1cmUta2V5LXdpdGgtMjU2LWJpdHMtZm9yLUpXVC1IQU1BQy1TSEEtYWxnb3JpdGht
